    <link rel="icon" type="image/png" sizes="512x512" href="https://fonts.gstatic.com/s/e/notoemoji/latest/2696_fe0f/512.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Balance%20scale/3D/balance_scale_3d.png" />

    <link rel="manifest" href="/manifest.json" />

    <script>
      // Global force update utility that purges all caches and service workers when manually clicked
      window.forceReloadLatestVersion = async function() {
        try {
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(function(r) { return r.unregister(); }));
          }
        } catch (e) {
          console.warn('Error purging cache:', e);
        }
        window.location.href = window.location.origin + '/?updated=' + Date.now();
      };

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function(reg) {
            reg.update();
          }).catch(function(err) {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
